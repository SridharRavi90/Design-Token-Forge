name: Deploy to Zoho Slate

on:
  push:
    branches: [main]
    paths:
      - 'packages/tokens/src/**'
      - 'packages/components/src/**'
      - 'packages/sync-server/**'
      - 'packages/figma-plugin/**'
      - 'demo/**'
      - 'projects/**'
      - '.github/workflows/deploy-tokens.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build static token files for all projects
        run: |
          for dir in projects/*/; do
            proj=$(basename "$dir")
            echo "Building project: $proj"
            node packages/sync-server/build-static.js --project "$proj" --out-dir ./dist
          done

      - name: Audit token drift (editor source ↔ dist mirror)
        # Fails the deploy if build-static.js mutated any
        # projects/<id>/*.css (which would clobber editor saves) or
        # if a project's dist mirror disagrees with the editor truth.
        run: node scripts/audit-token-drift.cjs

      - name: Copy plugin UI to root
        run: |
          mkdir -p dist/plugin
          cp demo/plugin/ui.html dist/plugin/ui.html

      - name: Copy root entry point and demo/ to dist/
        # dist/index.html  → Catalyst Slate entry (reads Zoho user ID, routes to /{userId}/)
        # dist/demo/       → hub + component explorer (auth-gate.js v3, catalyst-user.js)
        run: |
          # Root entry point — Catalyst-native auth splash that reads the
          # signed-in Zoho user_id and routes to /{userId}/index.html.
          cp dist/index.html dist/index.html.bak 2>/dev/null || true
          cat > dist/index.html << 'ENTRY_HTML'
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design Token Forge</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:#0b0d11;color:#f1f5f9;-webkit-font-smoothing:antialiased;display:grid;place-items:center}
  .s{display:flex;flex-direction:column;align-items:center;gap:18px;padding:40px 24px;text-align:center}
  .logo{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,#286CE5 0%,#8b5cf6 100%);display:grid;place-items:center;color:#fff;font-weight:800;font-size:22px}
  .title{font-size:20px;font-weight:700;color:#f1f5f9}
  .sub{font-size:13px;color:#94a3b8;max-width:280px}
  .spin{width:28px;height:28px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:#fff;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .err{font-size:12px;color:#f87171;max-width:320px;display:none}
  .btn{display:none;padding:10px 24px;border-radius:6px;border:none;background:#286CE5;color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
  .btn:hover{background:#1e54b8}
</style>
</head>
<body>
<div class="s">
  <div class="logo">DT</div>
  <div class="title">Design Token Forge</div>
  <p class="sub" id="sub">Signing you in&hellip;</p>
  <div class="spin" id="spin"></div>
  <p class="err" id="err"></p>
  <button class="btn" id="btn" type="button">Sign in with Zoho</button>
</div>
<script>
(function(){
  var sub=document.getElementById('sub'),spin=document.getElementById('spin'),
      err=document.getElementById('err'),btn=document.getElementById('btn');
  function showErr(m){spin.style.display='none';sub.style.display='none';err.textContent=m;err.style.display='block';btn.style.display='block';}
  function route(uid){
    var dest=uid?('/'+encodeURIComponent(uid)+'/index.html'):'/demo/index.html';
    sub.textContent='Redirecting\u2026';window.location.replace(dest);
  }
  function run(n){
    var sdk=window.catalyst||window.catalystApp;
    if(!sdk){if(n<50){setTimeout(function(){run(n+1);},100);}else{sub.textContent='Redirecting\u2026';window.location.replace('/demo/index.html');}return;}
    var auth=sdk.auth?sdk.auth():null;
    if(!auth||typeof auth.getCurrentUser!=='function'){window.location.replace('/demo/index.html');return;}
    auth.getCurrentUser().then(function(d){
      var ud=(d&&d.user_details)?d.user_details:(d||{});
      var uid=String(ud.user_id||ud.userId||'');
      try{sessionStorage.setItem('dtf-auth-ok','1');sessionStorage.setItem('dtf-catalyst-uid',uid);sessionStorage.setItem('dtf-catalyst-name',String(ud.first_name||ud.firstName||''));sessionStorage.setItem('dtf-catalyst-email',String(ud.email_id||ud.email||''));}catch(_e){}
      route(uid);
    }).catch(function(){
      showErr('Could not verify your Zoho account. Please sign in.');
      btn.onclick=function(){location.href='/__catalyst/auth/login?redirect_url='+encodeURIComponent(location.href);};
    });
  }
  run(0);
})();
</script>
</body>
</html>
ENTRY_HTML
          # Copy entire demo/ into dist/demo/ so hub + editor + components work
          cp -r demo/. dist/demo/

      - name: Deploy to pages branch (GitHub — used by Zoho Slate)
        # Zoho Slate reads from the 'pages' branch of the GitHub repository.
        # This branch contains ONLY the built dist/ output (no source files).
        # The site root is the branch root, so:
        #   /index.html          → dist/index.html (launchpad)
        #   /demo/               → dist/demo/ (hub + component explorer)
        #   /packages/tokens/src → dist/packages/tokens/src/ (design tokens CSS)
        #   /projects.json       → dist/projects.json (project list)
        #   /<project>/          → dist/<project>/ (per-project token mirror)
        run: |
          cd dist
          git init -q
          git checkout -q -b pages
          git add -A
          git -c user.name="Deploy Bot" -c user.email="deploy@dtf" \
              commit -q -m "Deploy $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          # Push to GitHub (authenticated via GITHUB_TOKEN)
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push --force origin pages

      - name: Commit demo/ sync back to main
        # build-static.js's syncDemoForZohoSlate() copies
        # packages/tokens/src/, packages/components/src/, projects.json,
        # and per-project token mirrors into demo/ so that Zoho Slate
        # (which serves from the demo/ folder on the main branch) can
        # resolve all asset paths correctly.
        # We commit these generated files back to main so Zoho always
        # has fresh content without needing a separate manual step.
        run: |
          git config user.name "Deploy Bot"
          git config user.email "deploy@dtf"
          git add demo/packages/ demo/projects.json
          # Add per-project mirrors (desktop-pdf-editor, pearl, etc.)
          for dir in projects/*/; do
            proj=$(basename "$dir")
            if [ -d "demo/$proj" ]; then
              git add "demo/$proj/"
            fi
          done
          # Only commit if there are staged changes
          if git diff --cached --quiet; then
            echo "No demo/ changes to commit."
          else
            git commit -m "chore(deploy): sync demo/ assets for Zoho Slate [skip ci]"
            git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
            git push origin main
          fi
