<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design Token Forge</title>
<!-- Catalyst Slate auth: this page is the entry point served at the root.
     Catalyst Slate handles authentication at the infrastructure level —
     unauthenticated visitors are redirected to Zoho login automatically.
     Once authenticated, the Catalyst Web SDK is available and we read
     the user's Zoho user_id to route them to their personalized workspace. -->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; min-height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #0b0d11; color: #f1f5f9;
    -webkit-font-smoothing: antialiased;
    display: grid; place-items: center;
  }
  .splash {
    display: flex; flex-direction: column; align-items: center; gap: 18px;
    padding: 40px 24px; text-align: center;
  }
  .splash-logo {
    width: 48px; height: 48px; border-radius: 12px;
    background: linear-gradient(135deg, #286CE5 0%, #8b5cf6 100%);
    display: grid; place-items: center;
    color: #fff; font-weight: 800; font-size: 22px; letter-spacing: -0.02em;
  }
  .splash-title {
    font-size: 20px; font-weight: 700; letter-spacing: -0.01em; color: #f1f5f9;
  }
  .splash-sub {
    font-size: 13px; color: #94a3b8; line-height: 1.5; max-width: 280px;
  }
  .splash-spinner {
    width: 28px; height: 28px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.15); border-top-color: #fff;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .splash-err {
    font-size: 12px; color: #f87171; max-width: 320px; line-height: 1.5;
    display: none;
  }
  .splash-btn {
    display: none; padding: 10px 24px; border-radius: 6px; border: none;
    background: #286CE5; color: #fff; font-size: 13px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  .splash-btn:hover { background: #1e54b8; }
</style>
</head>
<body>
<div class="splash">
  <div class="splash-logo">DT</div>
  <div class="splash-title">Design Token Forge</div>
  <p class="splash-sub" id="splashSub">Signing you in…</p>
  <div class="splash-spinner" id="splashSpinner"></div>
  <p class="splash-err" id="splashErr"></p>
  <button class="splash-btn" id="splashBtn" type="button">Sign in with Zoho</button>
</div>

<script>
(function () {
  'use strict';

  var subEl  = document.getElementById('splashSub');
  var spinner = document.getElementById('splashSpinner');
  var errEl  = document.getElementById('splashErr');
  var btnEl  = document.getElementById('splashBtn');

  function showError(msg) {
    spinner.style.display = 'none';
    subEl.style.display = 'none';
    errEl.textContent = msg;
    errEl.style.display = 'block';
    btnEl.style.display = 'block';
  }

  function getUser(sdk) {
    var auth = sdk.auth ? sdk.auth() : null;
    if (!auth || typeof auth.getCurrentUser !== 'function') return null;
    return auth.getCurrentUser();
  }

  function routeUser(userId) {
    /* Build the personalized URL: /{userId}/index.html
       If no userId is available, go to the main demo hub. */
    var dest = userId
      ? ('/' + encodeURIComponent(userId) + '/index.html')
      : '/demo/index.html';
    subEl.textContent = 'Redirecting…';
    window.location.replace(dest);
  }

  function tryRoute(attempts) {
    var sdk = window.catalyst || window.catalystApp;

    if (!sdk) {
      if (attempts < 50) {
        setTimeout(function () { tryRoute(attempts + 1); }, 100);
      } else {
        /* SDK never loaded — likely serving outside Catalyst Slate
           (local dev / GitHub Pages). Fall back to demo hub. */
        subEl.textContent = 'Redirecting to demo…';
        window.location.replace('/demo/index.html');
      }
      return;
    }

    var userPromise = getUser(sdk);
    if (!userPromise) {
      /* SDK loaded but no auth module — not on Catalyst Slate. */
      window.location.replace('/demo/index.html');
      return;
    }

    userPromise
      .then(function (details) {
        var ud = (details && details.user_details) ? details.user_details : (details || {});
        var userId = String(ud.user_id || ud.userId || '');
        if (userId) {
          /* Store for other pages to read via catalyst-user.js */
          try {
            sessionStorage.setItem('dtf-auth-ok', '1');
            sessionStorage.setItem('dtf-catalyst-uid', userId);
            sessionStorage.setItem('dtf-catalyst-name', String(ud.first_name || ud.firstName || ''));
            sessionStorage.setItem('dtf-catalyst-email', String(ud.email_id || ud.email || ''));
          } catch (_e) {}
        }
        routeUser(userId);
      })
      .catch(function () {
        /* Not authenticated — Catalyst Slate should have redirected
           before we got here. If we're on Slate, this shouldn't happen.
           Show a manual sign-in button as fallback. */
        showError('Could not verify your Zoho account. Please sign in.');
        btnEl.onclick = function () {
          var returnUrl = encodeURIComponent(location.href);
          location.href = '/__catalyst/auth/login?redirect_url=' + returnUrl;
        };
      });
  }

  /* Start checking for Catalyst SDK immediately */
  tryRoute(0);

})();
</script>
</body>
</html>
