<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design Token Forge</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:#0b0d11;color:#f1f5f9;-webkit-font-smoothing:antialiased;display:grid;place-items:center}
.s{display:flex;flex-direction:column;align-items:center;gap:18px;padding:40px 24px;text-align:center}
.logo{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,#286CE5 0%,#8b5cf6 100%);display:grid;place-items:center;color:#fff;font-weight:800;font-size:22px}
.title{font-size:20px;font-weight:700;color:#f1f5f9}
.sub{font-size:13px;color:#94a3b8;max-width:280px}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:#fff;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.err{display:none}
.btn{display:none;padding:10px 24px;border-radius:6px;border:none;background:#286CE5;color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.btn:hover{background:#1e54b8}
</style>
</head>
<body>
<div class="s">
  <div class="logo">DT</div>
  <div class="title">Design Token Forge</div>
  <p class="sub" id="sub">Signing you in&hellip;</p>
  <div class="spin" id="spin"></div>
  <p class="err" id="err"></p>
  <button class="btn" id="btn" type="button">Sign in with Zoho</button>
</div>
<script>
(function(){
  var sub=document.getElementById('sub'),
      spin=document.getElementById('spin'),
      btn=document.getElementById('btn');

  function showSignIn(){
    spin.style.display='none';
    sub.textContent='Welcome to Design Token Forge';
    btn.style.display='block';
    btn.onclick=function(){
      location.href='/__catalyst/auth/login?redirect_url='+encodeURIComponent('/hub.html');
    };
  }

  /* Fast path: already verified this session → go straight to hub. */
  try{
    if(sessionStorage.getItem('dtf-auth-ok')==='1'){
      sub.textContent='Redirecting\u2026';
      window.location.replace('/hub.html');
      return;
    }
  }catch(_e){}

  /* Try Catalyst SDK (available when already logged in via Slate). */
  function run(n){
    var sdk=window.catalyst||window.catalystApp;

    if(!sdk){
      if(n<50){setTimeout(function(){run(n+1);},100);}
      else{
        /* SDK never loaded — not logged in. Show Sign In button. */
        showSignIn();
      }
      return;
    }

    var auth=sdk.auth?sdk.auth():null;
    if(!auth||typeof auth.getCurrentUser!=='function'){
      /* SDK present but no getCurrentUser (Slate context).
         Can't tell if logged in — show Sign In button. */
      showSignIn();
      return;
    }

    auth.getCurrentUser()
      .then(function(d){
        var ud=(d&&d.user_details)?d.user_details:(d||{});
        var uid=String(ud.user_id||ud.userId||'');
        var email=String(ud.email_id||ud.emailId||ud.email||ud.email_address||ud.emailAddress||'');
        var name=String(ud.first_name||ud.firstName||ud.name||'');
        try{
          sessionStorage.setItem('dtf-auth-ok','1');
          sessionStorage.setItem('dtf-catalyst-uid',uid);
          sessionStorage.setItem('dtf-catalyst-name',name);
          sessionStorage.setItem('dtf-catalyst-email',email);
        }catch(_e){}
        sub.textContent='Redirecting\u2026';
        window.location.replace('/hub.html');
      })
      .catch(function(){
        /* Not logged in — show Sign In button. */
        showSignIn();
      });
  }

  run(0);
})();
</script>
</body>
</html>
