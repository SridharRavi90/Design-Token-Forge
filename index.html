<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design Token Forge</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:#0b0d11;color:#f1f5f9;-webkit-font-smoothing:antialiased;display:grid;place-items:center}
.s{display:flex;flex-direction:column;align-items:center;gap:18px;padding:40px 24px;text-align:center}
.logo{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,#286CE5 0%,#8b5cf6 100%);display:grid;place-items:center;color:#fff;font-weight:800;font-size:22px}
.title{font-size:20px;font-weight:700;color:#f1f5f9}
.sub{font-size:13px;color:#94a3b8;max-width:280px}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:#fff;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.err{display:none}
.btn{display:none;padding:10px 24px;border-radius:6px;border:none;background:#286CE5;color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.btn:hover{background:#1e54b8}
</style>
</head>
<body>
<div class="s">
  <div class="logo">DT</div>
  <div class="title">Design Token Forge</div>
  <p class="sub" id="sub">Signing you in&hellip;</p>
  <div class="spin" id="spin"></div>
  <p class="err" id="err"></p>
  <button class="btn" id="btn" type="button">Sign in with Zoho</button>
</div>
<script>
(function(){
  var sub=document.getElementById('sub'),
      spin=document.getElementById('spin'),
      btn=document.getElementById('btn');

  function showSignIn(){
    spin.style.display='none';
    sub.textContent='Welcome to Design Token Forge';
    btn.style.display='block';
    btn.onclick=function(){
      location.href='/__catalyst/auth/login?redirect_url=/hub.html';
    };
  }

  /* Fast path: already verified this session → go straight to hub.
     No spinner needed — user is already authenticated. */
  try{
    if(sessionStorage.getItem('dtf-auth-ok')==='1'){
      window.location.replace('/hub.html');
      return;
    }
  }catch(_e){}

  /* Check authentication status via Catalyst BaaS (same-origin, fast ~200ms).
     200 = active Catalyst session → redirect to hub without showing Sign In.
     401/error = not logged in → show Sign In button immediately.
     This replaces the old 5-second SDK poll and also handles the
     "don't show Sign In again if already signed in this browser session" case. */
  var _done=false;
  function _finish(loggedIn,uid,email,name){
    if(_done)return; _done=true;
    if(loggedIn){
      try{
        sessionStorage.setItem('dtf-auth-ok','1');
        if(uid)   sessionStorage.setItem('dtf-catalyst-uid',uid);
        if(email) sessionStorage.setItem('dtf-catalyst-email',email);
        if(name)  sessionStorage.setItem('dtf-catalyst-name',name);
      }catch(_e){}
      sub.textContent='Redirecting\u2026';
      window.location.replace('/hub.html');
    }else{
      showSignIn();
    }
  }

  /* 1.5s safety net: if BaaS never responds, show Sign In button. */
  var _timer=setTimeout(function(){_finish(false);},1500);

  fetch('/__catalyst/baas/v1/project/38969000000013030/appuser/',{credentials:'include'})
    .then(function(r){
      clearTimeout(_timer);
      if(!r.ok){_finish(false);return;}
      r.json().then(function(data){
        /* Catalyst BaaS wraps user_details in different shapes — try all. */
        var ud=(data&&data.data&&data.data.user_details)?data.data.user_details:
               (data&&data.user_details)?data.user_details:
               (Array.isArray(data)&&data[0])?data[0]:
               (data&&data.data)?data.data:(data||{});
        var email=String(ud.email_id||ud.emailId||ud.email||ud.email_address||'');
        var uid  =String(ud.user_id ||ud.userId ||ud.id  ||'');
        var name =String(ud.first_name||ud.firstName||ud.name||'');
        _finish(true,uid,email,name);
      }).catch(function(){_finish(true);});/* 200 but bad JSON = still logged in */
    })
    .catch(function(){
      clearTimeout(_timer);
      _finish(false);
    });
})();
</script>
</body>
</html>
